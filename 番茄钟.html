<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄钟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%85%3C/text%3E%3C/svg%3E">
<style>
:root{
  --accent:#e5484d;
  --bg:#f5f3ee;
  --card:#ffffff;
  --soft:#efede8;
  --text:#20242e;
  --muted:#8a8f9c;
  --line:#e6e3dd;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161b;
    --card:#1d2027;
    --soft:#262a33;
    --text:#e8eaef;
    --muted:#8b91a0;
    --line:#2e333d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;justify-content:center;
  padding:22px 16px;
}
.app{
  width:100%;max-width:460px;
  background:var(--card);
  border-radius:22px;
  padding:22px 24px 16px;
  box-shadow:0 10px 36px rgba(0,0,0,.10);
  display:flex;flex-direction:column;gap:14px;
}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:21px;font-weight:700}
.stats{font-size:13px;color:var(--muted)}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{
  flex:1;border:0;background:transparent;color:var(--muted);
  font-size:14px;padding:9px 4px;border-radius:9px;cursor:pointer;
  transition:background .2s,color .2s;
}
.tabs button.active{background:var(--accent);color:#fff;font-weight:600}
.ring-wrap{position:relative;width:min(280px,80vw);margin:0 auto;aspect-ratio:1}
.ring{width:100%;height:100%}
.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:var(--line)}
.ring .fg{
  stroke:var(--accent);stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .25s linear,stroke .4s;
}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
}
.time{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px}
.phase{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .3s}
.dot.filled{background:var(--accent)}
.quote{text-align:center;font-size:13px;color:var(--muted);min-height:20px}
.goal input{
  width:100%;padding:11px 14px;border-radius:12px;
  border:1px solid var(--line);background:transparent;
  color:var(--text);font-size:14px;outline:none;
}
.goal input:focus{border-color:var(--accent)}
.controls{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px}
.controls button{
  padding:13px 8px;border-radius:13px;font-size:15px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
  transition:filter .15s,transform .1s;
}
.controls button.primary{
  background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
}
.controls button:hover{filter:brightness(1.06)}
.controls button:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{
  padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  transition:background .2s,color .2s,border-color .2s;
}
.chip.active{
  background:color-mix(in srgb,var(--accent) 14%,transparent);
  border-color:var(--accent);color:var(--accent);
}
.durations{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.durations label{display:flex;align-items:center;gap:5px}
.durations input{
  width:52px;padding:5px 4px;text-align:center;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px;
}
.tasknow{
  text-align:center;font-size:13px;line-height:1.5;color:var(--muted);
  cursor:pointer;min-height:20px;
}
.tasknow b{color:var(--text)}
.tasknow .over{color:#e8a13c}
.tasknow:hover{color:var(--accent)}
.interrupts{display:flex;justify-content:center;gap:8px}
.it-btn{
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:12px;cursor:pointer;
  transition:border-color .2s,color .2s,opacity .2s;
}
.it-btn b{color:var(--accent);margin-left:2px;font-variant-numeric:tabular-nums}
.it-btn:hover{border-color:var(--accent);color:var(--accent)}
.it-btn.off{opacity:.45}
.it-btn.pulse{animation:itpulse .35s ease}
@keyframes itpulse{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1)}}
footer{text-align:center;font-size:12px;color:var(--muted)}

/* ---------- 舒尔特方格 ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:50;backdrop-filter:blur(3px);
}
.overlay[hidden]{display:none}
.schulte-card{
  background:var(--card);border-radius:20px;padding:22px;
  width:100%;max-width:430px;max-height:92vh;overflow:auto;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.s-head{display:flex;justify-content:space-between;align-items:center}
.s-head h2{font-size:18px}
.s-close{
  border:0;background:transparent;color:var(--muted);font-size:18px;
  cursor:pointer;padding:4px 8px;border-radius:8px;
}
.s-close:hover{background:var(--soft)}
.s-tip{font-size:13px;color:var(--muted)}
.s-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.s-sizes{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.s-sizes button{
  border:0;background:transparent;color:var(--muted);font-size:12px;
  padding:5px 10px;border-radius:7px;cursor:pointer;
}
.s-sizes button.active{background:var(--accent);color:#fff}
.s-meters{display:flex;align-items:center;gap:12px;font-size:14px;font-variant-numeric:tabular-nums}
#sTimer{font-weight:700}
#sMistakes{color:var(--muted)}
.s-mini{
  padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:12px;cursor:pointer;
}
.s-mini:hover{border-color:var(--accent);color:var(--accent)}
.s-grid{display:grid;gap:8px;user-select:none}
.s-cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border:0;border-radius:10px;font-weight:600;cursor:pointer;
  background:var(--soft);color:var(--text);
  transition:transform .06s,background .15s;
}
.s-cell:hover{background:color-mix(in srgb,var(--accent) 14%,var(--soft))}
.s-cell:active{transform:scale(.93)}
.s-cell.hit{background:var(--accent);color:#fff;cursor:default}
.s-cell.wrong{background:#e5484d;color:#fff}
.s-result{
  text-align:center;font-size:15px;line-height:1.9;
  padding:12px;border-radius:12px;background:var(--soft);
}
.rating{font-weight:700}
.great{color:#2f9e6e}
.good{color:#4c6ef5}
.ok{color:#e8a13c}
.bad{color:#e5484d}
.s-best{text-align:center;font-size:12px;color:var(--muted)}
.s-actions{display:flex;gap:10px}
.s-actions button{
  flex:1;padding:12px;border-radius:12px;font-size:15px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
}
.s-actions button.primary{
  background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
}
.s-auto{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.s-auto input{accent-color:var(--accent)}
.stats-summary{font-size:14px;line-height:1.9}
.stats-summary b{font-size:16px}
.stats-bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:6px 0}
.stats-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.stats-bar{width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 0 0;transition:height .3s}
.stats-bar.zero{background:var(--line)}
.stats-bar-val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats-bar-label{font-size:11px;color:var(--muted)}
.stats-total{font-size:12px;color:var(--muted);line-height:1.7}
.stats-io{width:100%;height:76px;padding:8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:12px;font-family:ui-monospace,Consolas,monospace;resize:none}
.stats-hint{font-size:11px;color:var(--muted);text-align:center}
.task-add{display:flex;gap:8px;align-items:center}
.task-add input{
  padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--text);font-size:13px;outline:none;min-width:0;
}
.task-add input:focus{border-color:var(--accent)}
.task-add #taskTitle{flex:1}
.task-add #taskEst{width:58px;text-align:center;flex:none}
.task-add button{
  padding:9px 14px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--text);font-size:13px;cursor:pointer;flex:none;
}
.task-add button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.task-list{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto}
.task-empty{text-align:center;font-size:13px;color:var(--muted);padding:18px 0}
.task-item{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:6px 8px}
.task-item.active{box-shadow:inset 0 0 0 2px var(--accent)}
.task-pick{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:0;background:transparent;color:var(--text);text-align:left;
  padding:6px 4px;font-size:14px;cursor:pointer;
}
.task-pick .t-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-pick .t-meta{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.task-pick .t-meta.over{color:#e8a13c}
.task-item.done .t-title{text-decoration:line-through;color:var(--muted)}
.task-item .t-icon{
  flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;
}
.task-item .t-icon:hover{color:var(--accent);border-color:var(--accent)}
.task-summary{font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🍅 番茄钟</h1>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-mode="focus" class="active">专注</button>
    <button data-mode="short">短休息</button>
    <button data-mode="long">长休息</button>
  </nav>
  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 280 280">
      <circle class="bg" cx="140" cy="140" r="124"></circle>
      <circle class="fg" id="ringFg" cx="140" cy="140" r="124"></circle>
    </svg>
    <div class="ring-center">
      <div class="time" id="time">25:00</div>
      <div class="phase" id="phase">专注</div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
  <div class="quote" id="quote">准备好了吗？点击「开始」🍅</div>
  <div class="tasknow" id="taskNow" title="打开今日待办">当前任务：未选择 · 点击打开今日待办</div>
  <div class="interrupts">
    <button class="it-btn off" id="btnInner" title="记录一次内部中断（走神、想看手机……），番茄继续">🧠 走神 <b id="cntInner">0</b></button>
    <button class="it-btn off" id="btnOuter" title="记录一次外部中断（有人找你、来电……），番茄继续">📞 被打扰 <b id="cntOuter">0</b></button>
  </div>
  <div class="goal"><input id="goal" placeholder="🎯 今天最重要的一件事…" maxlength="60"></div>
  <div class="controls">
    <button id="reset" title="重置 (R)">重置</button>
    <button id="main" class="primary">开始</button>
    <button id="skip" title="跳过 (S)">跳过</button>
  </div>
  <div class="chips">
    <button id="chipAuto" class="chip active" title="结束后自动开始下一阶段">⏭ 自动开始</button>
    <button id="chipSound" class="chip active">🔔 提示音</button>
    <button id="chipNoise" class="chip">🌊 白噪音</button>
    <button id="chipFull" class="chip" title="全屏 (F)">全屏</button>
    <button id="chipSchulte" class="chip" title="专注力测试">🎯 舒尔特测试</button>
    <button id="chipTasks" class="chip" title="今日待办、番茄预估与完成情况">📋 任务</button>
    <button id="chipStats" class="chip" title="专注统计与数据备份">📊 统计</button>
  </div>
  <div class="durations">
    <label>专注 <input type="number" id="dFocus" min="1" max="180"> 分</label>
    <label>短休 <input type="number" id="dShort" min="1" max="60"> 分</label>
    <label>长休 <input type="number" id="dLong" min="1" max="60"> 分</label>
  </div>
  <footer>空格 开始/暂停 · R 重置 · S 跳过 · F 全屏</footer>
</div>

<!-- 舒尔特方格弹层 -->
<div class="overlay" id="schulte" hidden>
  <div class="schulte-card">
    <div class="s-head">
      <h2>🎯 舒尔特方格</h2>
      <button class="s-close" id="sClose" title="关闭 (Esc)">✕</button>
    </div>
    <p class="s-tip">按 1 → N 的顺序依次点击数字，越快说明注意力越集中</p>
    <div class="s-toolbar">
      <div class="s-sizes" id="sSizes">
        <button data-size="4">4×4</button>
        <button data-size="5" class="active">5×5</button>
        <button data-size="6">6×6</button>
      </div>
      <div class="s-meters">
        <button id="sRestart" class="s-mini">重来</button>
        <span id="sTimer">0.0 s</span>
        <span id="sMistakes">错误 0</span>
      </div>
    </div>
    <div class="s-grid" id="sGrid"></div>
    <div class="s-result" id="sResult" hidden></div>
    <div class="s-best" id="sBest"></div>
    <div class="s-actions">
      <button id="sAgain" hidden>再测一次</button>
      <button id="sGo" class="primary" hidden>开始专注 🍅</button>
    </div>
    <label class="s-auto"><input type="checkbox" id="sAuto" checked> 每次开始专注前先测一测</label>
  </div>
</div>

<!-- 专注统计弹层 -->
<div class="overlay" id="statsPanel" hidden>
  <div class="schulte-card">
    <div class="s-head">
      <h2>📊 专注统计</h2>
      <button class="s-close" id="statsClose" title="关闭 (Esc)">✕</button>
    </div>
    <div class="stats-summary" id="statsSummary"></div>
    <div class="stats-bars" id="statsBars"></div>
    <div class="stats-total" id="statsTotal"></div>
    <textarea class="stats-io" id="statsIO" placeholder="导出的备份会显示在这里；导入时把备份内容粘贴到这里" spellcheck="false"></textarea>
    <div class="s-actions">
      <button id="statsExport">📤 导出备份</button>
      <button id="statsImport">📥 导入备份</button>
    </div>
    <p class="stats-hint">数据只保存在本机，建议定期导出备份</p>
  </div>
</div>

<!-- 今日待办弹层 -->
<div class="overlay" id="taskPanel" hidden>
  <div class="schulte-card">
    <div class="s-head">
      <h2>📋 今日待办</h2>
      <button class="s-close" id="taskClose" title="关闭 (Esc)">✕</button>
    </div>
    <p class="s-tip">每个任务预估 1~7 个番茄；完成的专注会自动记在当前任务上</p>
    <div class="task-add">
      <input id="taskTitle" maxlength="40" placeholder="要完成的任务…">
      <input id="taskEst" type="number" min="1" max="7" value="1" title="预计番茄数">
      <button id="taskAdd" class="primary">添加</button>
    </div>
    <div class="task-list" id="taskList"></div>
    <div class="task-summary" id="taskSummary"></div>
    <p class="stats-hint">一个番茄不可分割；被彻底打断就按 R 作废重来，不要算半个番茄</p>
  </div>
</div>

<script>
'use strict'
const $ = id => document.getElementById(id)
const el = {
  time: $('time'), phase: $('phase'), dots: $('dots'), stats: $('stats'), quote: $('quote'),
  main: $('main'), reset: $('reset'), skip: $('skip'), tabs: $('tabs'),
  ringFg: $('ringFg'), goal: $('goal'),
  taskNow: $('taskNow'), btnInner: $('btnInner'), btnOuter: $('btnOuter'),
  cntInner: $('cntInner'), cntOuter: $('cntOuter'),
  chipAuto: $('chipAuto'), chipSound: $('chipSound'), chipNoise: $('chipNoise'), chipFull: $('chipFull'),
  chipSchulte: $('chipSchulte'), chipTasks: $('chipTasks'), chipStats: $('chipStats'),
  dFocus: $('dFocus'), dShort: $('dShort'), dLong: $('dLong'),
  schulte: $('schulte'), sGrid: $('sGrid'), sTimer: $('sTimer'), sMistakes: $('sMistakes'),
  sResult: $('sResult'), sBest: $('sBest'), sAgain: $('sAgain'), sGo: $('sGo'), sClose: $('sClose'),
  sRestart: $('sRestart'), sSizes: $('sSizes'), sAuto: $('sAuto'),
  statsPanel: $('statsPanel'), statsSummary: $('statsSummary'), statsBars: $('statsBars'),
  statsTotal: $('statsTotal'), statsIO: $('statsIO'), statsClose: $('statsClose'),
  statsExport: $('statsExport'), statsImport: $('statsImport'),
  taskPanel: $('taskPanel'), taskClose: $('taskClose'), taskTitle: $('taskTitle'),
  taskEst: $('taskEst'), taskAdd: $('taskAdd'), taskList: $('taskList'), taskSummary: $('taskSummary'),
}

const MODES = {
  focus: { name: '专注', color: '#e5484d' },
  short: { name: '短休息', color: '#2f9e6e' },
  long:  { name: '长休息', color: '#4c6ef5' },
}
const QUOTES = {
  focus: ['把手机放远一点，现在只做这一件事 🍅','先完成，再完美。','25 分钟后，你会感谢现在的自己。','深呼吸，专注当下这一分钟。','最好的开始时间，就是现在。'],
  break: ['起来走走，喝口水 💧','看看远处，放松眼睛 👀','伸个懒腰，再战一轮 💪'],
}
const RING_R = 124
const CIRC = 2 * Math.PI * RING_R
el.ringFg.style.strokeDasharray = CIRC

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key)
    if (raw == null) return fallback
    const v = JSON.parse(raw)
    if (v && typeof v === 'object') return Object.assign({}, fallback, v)
  } catch (e) {}
  return Object.assign({}, fallback)
}
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)) } catch (e) {} }

let settings = load('pomo.settings', { focus: 25, short: 5, long: 15, auto: true, sound: true, noise: false, schulte: true })
settings.noise = false // 白噪音只在本次打开期间有效
let mode = 'focus'
let running = false
let endTime = 0
let remaining = settings.focus * 60
let sessionTotal = remaining // 本轮开始时的总时长（秒）；计时中途修改时长只影响下一轮
let timerId = null
let cyclePos = 0 // 本循环内已完成的专注数 0-4
let sessionInner = 0 // 本轮专注内记录的内部中断数
let sessionOuter = 0 // 本轮专注内记录的外部中断数

function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() }
// 每日专注记录：history['YYYY-M-D'] = { count: 番茄数, minutes: 专注分钟 }
let history = load('pomo.history', {})
// 兼容旧版 pomo.today 单日数据，自动迁移进 history
try {
  if (!Object.keys(history).length) {
    const old = JSON.parse(localStorage.getItem('pomo.today') || 'null')
    if (old && old.date && (old.count || old.minutes)) history[old.date] = { count: old.count || 0, minutes: old.minutes || 0 }
  }
} catch (e) {}
function saveHistory() { save('pomo.history', history) }
let today = history[todayKey()] || { count: 0, minutes: 0 }

/* ---------- 今日待办（计划 + 番茄预估 + 实际投入） ---------- */
function newTaskId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }
function normalizeTasks(doc) {
  const out = { date: todayKey(), items: [] }
  if (!doc || !Array.isArray(doc.items)) return out
  const sameDay = doc.date === out.date
  doc.items.forEach(it => {
    if (!it || typeof it.title !== 'string') return
    const title = it.title.trim().slice(0, 40)
    if (!title) return
    if (!sameDay && it.done) return // 跨天只顺延未完成的任务
    out.items.push({
      id: typeof it.id === 'string' && it.id ? it.id : newTaskId(),
      title: title,
      est: Math.min(7, Math.max(1, parseInt(it.est, 10) || 1)),
      pomos: Math.max(0, parseInt(it.pomos, 10) || 0),
      done: !!it.done,
    })
  })
  return out
}
let tasksDoc = normalizeTasks(load('pomo.tasks', { date: todayKey(), items: [] }))
let activeTaskId = ''
try { activeTaskId = localStorage.getItem('pomo.activeTask') || '' } catch (e) {}
function saveTasks() { save('pomo.tasks', tasksDoc) }
saveTasks()
function activeTask() { return tasksDoc.items.find(t => t.id === activeTaskId && !t.done) || null }
if (activeTaskId && !activeTask()) {
  activeTaskId = ''
  try { localStorage.removeItem('pomo.activeTask') } catch (e) {}
}
let sessionTaskId = activeTaskId // 本轮专注归属的任务；中途勾完成也不改变本轮归属
let todayStamp = todayKey()
function ensureToday() {
  const k = todayKey()
  if (k === todayStamp) return
  todayStamp = k
  today = history[k] || { count: 0, minutes: 0 }
  // 新的一天：未完成任务顺延，已完成的归档
  tasksDoc = { date: k, items: tasksDoc.items.filter(t => !t.done) }
  saveTasks()
  if (activeTaskId && !activeTask()) {
    activeTaskId = ''
    try { localStorage.removeItem('pomo.activeTask') } catch (e) {}
  }
  if (sessionTaskId && !tasksDoc.items.some(t => t.id === sessionTaskId)) sessionTaskId = ''
  renderTaskNow()
  renderTaskList()
  render()
}

/* ---------- 音频 ---------- */
let actx = null
function audio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC() }
  if (actx && actx.state === 'suspended') actx.resume()
  return actx
}
function tone(freq, when, dur, vol) {
  const ctx = audio(); if (!ctx) return
  const o = ctx.createOscillator(), g = ctx.createGain()
  o.type = 'sine'
  o.frequency.value = freq
  g.gain.setValueAtTime(0.0001, when)
  g.gain.linearRampToValueAtTime(vol, when + 0.015)
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur)
  o.connect(g)
  g.connect(ctx.destination)
  o.start(when)
  o.stop(when + dur + 0.05)
}
function playBell() {
  if (!settings.sound) return
  const ctx = audio(); if (!ctx) return
  const t = ctx.currentTime + 0.02
  tone(659.25, t, 1.6, 0.32)       // E5
  tone(1318.5, t, 1.3, 0.12)       // E6
  tone(1975.5, t, 0.9, 0.05)
  tone(523.25, t + 0.35, 1.9, 0.30) // C5
  tone(1046.5, t + 0.35, 1.4, 0.10)
}
let noiseNodes = null
function pinkBuffer(ctx) {
  const len = ctx.sampleRate * 2
  const buf = ctx.createBuffer(1, len, ctx.sampleRate)
  const d = buf.getChannelData(0)
  let b0 = 0, b1 = 0, b2 = 0
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1
    b0 = 0.997 * b0 + 0.029 * w
    b1 = 0.985 * b1 + 0.032 * w
    b2 = 0.950 * b2 + 0.048 * w
    d[i] = (b0 + b1 + b2 + w * 0.05) * 0.11
  }
  return buf
}
function noiseOn() {
  const ctx = audio(); if (!ctx || noiseNodes) return
  const src = ctx.createBufferSource()
  src.buffer = pinkBuffer(ctx)
  src.loop = true
  const lp = ctx.createBiquadFilter()
  lp.type = 'lowpass'
  lp.frequency.value = 1600
  const g = ctx.createGain()
  g.gain.setValueAtTime(0.0001, ctx.currentTime)
  g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + 0.6)
  src.connect(lp); lp.connect(g); g.connect(ctx.destination)
  src.start()
  noiseNodes = [src, lp, g]
}
function noiseOff() {
  if (!noiseNodes) return
  const src = noiseNodes[0], g = noiseNodes[2]
  noiseNodes = null
  const ctx = audio()
  if (ctx) {
    try {
      g.gain.cancelScheduledValues(ctx.currentTime)
      g.gain.setValueAtTime(g.gain.value, ctx.currentTime)
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3)
    } catch (e) {}
  }
  setTimeout(() => { try { src.stop() } catch (e) {} }, 450)
}

/* ---------- 通知 ---------- */
function notice(title, body) {
  const hosted = !!(window.pomoBridge || (window.chrome && chrome.webview))
  if (hosted && document.hidden) return // 托盘版窗口隐藏时由宿主进程发通知
  try {
    if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body: body })
  } catch (e) {}
}

/* ---------- 托盘版桥接（Electron / WebView2） ---------- */
function postState(left) {
  const msg = { type: 'state', mode: mode, label: MODES[mode].name, running: running, remaining: left }
  try {
    if (window.pomoBridge) { window.pomoBridge.post(msg); return }
    if (window.chrome && chrome.webview && chrome.webview.postMessage) chrome.webview.postMessage(msg)
  } catch (e) {}
}
function postDone(finished, count) {
  const msg = { type: 'done', finished: finished, count: count }
  try {
    if (window.pomoBridge) { window.pomoBridge.post(msg); return }
    if (window.chrome && chrome.webview && chrome.webview.postMessage) chrome.webview.postMessage(msg)
  } catch (e) {}
}
window.__pomoCmd = function (cmd) {
  if (cmd === 'ping') {
    postState(running ? Math.max(0, Math.round((endTime - Date.now()) / 1000)) : remaining)
    return
  }
  if (cmd === 'start') { if (schulte.open) sClose(); start(true); return }
  if (cmd === 'pause') { pause(); return }
  if (cmd === 'skip') { skip(); return }
  if (cmd === 'complete') { if (running) complete() }
}
try {
  if (window.pomoBridge && window.pomoBridge.onCmd) window.pomoBridge.onCmd((c) => window.__pomoCmd(c))
} catch (e) {}

/* ---------- 计时 ---------- */
function total() { return settings[mode] * 60 }
function fmt(s) {
  s = Math.max(0, s)
  const m = Math.floor(s / 60), r = s % 60
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0')
}
function switchTo(m) {
  mode = m
  sessionTotal = total()
  remaining = sessionTotal
  sessionInner = 0
  sessionOuter = 0
  sessionTaskId = m === 'focus' ? activeTaskId : ''
  render()
  renderTaskNow()
}
function start(bypass) {
  if (running) return
  ensureToday()
  if (mode === 'focus' && remaining >= sessionTotal) sessionTaskId = activeTaskId
  if (!bypass && mode === 'focus' && settings.schulte) { sOpen(true); return }
  audio()
  try {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission()
  } catch (e) {}
  const quotes = QUOTES[mode] || QUOTES.focus
  el.quote.textContent = quotes[Math.floor(Math.random() * quotes.length)]
  endTime = Date.now() + remaining * 1000
  running = true
  timerId = setInterval(tick, 250)
  render()
}
function pause() {
  if (!running) return
  running = false
  clearInterval(timerId); timerId = null
  remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000))
  render()
}
function toggle() { running ? pause() : start() }
function reset() {
  if (running) pause()
  ensureToday()
  sessionTotal = total()
  remaining = sessionTotal
  sessionInner = 0
  sessionOuter = 0
  sessionTaskId = mode === 'focus' ? activeTaskId : ''
  render()
  renderTaskNow()
}
function nextMode() { return mode === 'focus' ? 'short' : 'focus' }
function skip() {
  const was = running
  if (running) pause()
  if (mode === 'long') cyclePos = 0
  switchTo(nextMode())
  if (was) start(true)
}
function tick() {
  ensureToday()
  const left = Math.max(0, Math.round((endTime - Date.now()) / 1000))
  remaining = left
  render()
  if (left <= 0) complete()
}
function complete() {
  ensureToday()
  running = false
  clearInterval(timerId); timerId = null
  remaining = 0
  playBell()
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 300]) } catch (e) {}
  const finished = mode
  if (finished === 'focus') {
    cyclePos = Math.min(cyclePos + 1, 4)
    const k = todayKey()
    const rec = history[k] || { count: 0, minutes: 0 }
    rec.count++
    rec.minutes += Math.round(sessionTotal / 60) // 按本轮实际时长记账，避免中途改设置虚增
    history[k] = rec
    today = rec
    saveHistory()
    const t = tasksDoc.items.find(x => x.id === sessionTaskId)
    if (t) {
      t.pomos++
      saveTasks()
      renderTaskNow()
      if (!el.taskPanel.hidden) renderTaskList()
      if (t.pomos === t.est && !t.done) toast('「' + t.title + '」已达到预估番茄数，完成了吗？')
    }
    notice('专注完成！', '已完成 ' + today.count + ' 个番茄，休息一下吧 ☕')
  } else if (finished === 'long') {
    cyclePos = 0
    notice('长休息结束', '开始新的一轮专注吧 🍅')
  } else {
    notice('休息结束', '开始专注吧 🍅')
  }
  postDone(finished, today.count)
  switchTo(finished === 'focus' ? (cyclePos >= 4 ? 'long' : 'short') : 'focus')
  if (settings.auto) start()
}
function render() {
  const t = sessionTotal
  const left = running ? Math.max(0, Math.round((endTime - Date.now()) / 1000)) : remaining
  el.time.textContent = fmt(left)
  el.phase.textContent = MODES[mode].name
  const p = t > 0 ? Math.min(1, 1 - left / t) : 0
  el.ringFg.style.strokeDashoffset = CIRC * (1 - p)
  document.documentElement.style.setProperty('--accent', MODES[mode].color)
  el.main.textContent = running ? '暂停' : (left < t ? '继续' : '开始')
  el.stats.textContent = '今天 🍅 × ' + today.count + ' · 专注 ' + today.minutes + ' 分钟'
  Array.from(el.tabs.children).forEach(b => b.classList.toggle('active', b.dataset.mode === mode))
  el.dots.innerHTML = ''
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('span')
    s.className = 'dot' + (i < cyclePos ? ' filled' : '')
    el.dots.appendChild(s)
  }
  document.title = fmt(left) + ' ' + MODES[mode].name + ' · 番茄钟'
  renderInterrupts()
  postState(left)
}

/* ---------- 今日待办与中断记录 ---------- */
function focusInProgress() { return mode === 'focus' && (running || remaining < sessionTotal) }
function renderTaskNow() {
  el.taskNow.innerHTML = ''
  const t = activeTask()
  if (t) {
    el.taskNow.append('当前任务：')
    const b = document.createElement('b')
    b.textContent = t.title
    el.taskNow.append(b)
    const meta = document.createElement('span')
    meta.className = t.pomos > t.est ? 'over' : ''
    meta.textContent = ' · 🍅 ' + t.pomos + '/' + t.est
    el.taskNow.append(meta)
    return
  }
  // 任务中途勾了完成，本轮专注仍归属它，直到本轮结束
  const st = sessionTaskId && focusInProgress() ? tasksDoc.items.find(x => x.id === sessionTaskId) : null
  if (st) {
    el.taskNow.append('本轮计入：')
    const b = document.createElement('b')
    b.textContent = st.title
    el.taskNow.append(b)
    const meta = document.createElement('span')
    meta.textContent = ' · 已完成'
    el.taskNow.append(meta)
    return
  }
  el.taskNow.textContent = '当前任务：未选择 · 点击打开今日待办'
}
function renderTaskList() {
  el.taskList.innerHTML = ''
  const items = tasksDoc.items.slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0))
  if (!items.length) {
    const empty = document.createElement('div')
    empty.className = 'task-empty'
    empty.textContent = '还没有任务，先写下今天要完成的事吧'
    el.taskList.appendChild(empty)
  }
  items.forEach(t => {
    const row = document.createElement('div')
    row.className = 'task-item' + (t.done ? ' done' : '') + (t.id === activeTaskId && !t.done ? ' active' : '')
    row.dataset.id = t.id
    const pick = document.createElement('button')
    pick.className = 'task-pick'
    pick.dataset.act = 'pick'
    pick.title = t.done ? '已完成' : '点击设为当前任务'
    const title = document.createElement('span')
    title.className = 't-title'
    title.textContent = t.title
    const meta = document.createElement('span')
    meta.className = 't-meta' + (t.pomos > t.est ? ' over' : '')
    meta.textContent = '🍅 ' + t.pomos + '/' + t.est
    pick.append(title, meta)
    const doneBtn = document.createElement('button')
    doneBtn.className = 't-icon'
    doneBtn.dataset.act = 'done'
    doneBtn.title = t.done ? '恢复未完成' : '标记完成'
    doneBtn.textContent = t.done ? '↩' : '✓'
    const delBtn = document.createElement('button')
    delBtn.className = 't-icon'
    delBtn.dataset.act = 'del'
    delBtn.title = '删除任务'
    delBtn.textContent = '✕'
    row.append(pick, doneBtn, delBtn)
    el.taskList.appendChild(row)
  })
  const open = tasksDoc.items.filter(t => !t.done)
  const est = open.reduce((a, t) => a + t.est, 0)
  const spent = open.reduce((a, t) => a + t.pomos, 0)
  el.taskSummary.textContent = open.length
    ? '未完成 ' + open.length + ' 项 · 已投入 ' + spent + ' 个番茄 · 预计还需 ' + Math.max(0, est - spent) + ' 个'
    : (tasksDoc.items.length ? '今日任务已全部完成 🎉' : '')
}
function assignActiveTask(id) {
  activeTaskId = id || ''
  try {
    if (activeTaskId) localStorage.setItem('pomo.activeTask', activeTaskId)
    else localStorage.removeItem('pomo.activeTask')
  } catch (e) {}
  // 专注进行中切换当前任务时，本轮番茄随之归到新任务
  if (mode === 'focus') sessionTaskId = activeTaskId
  renderTaskNow()
  renderTaskList()
}
function setActiveTask(id) { assignActiveTask(activeTaskId === id ? '' : id) }
function addTask() {
  ensureToday()
  const title = el.taskTitle.value.trim().slice(0, 40)
  if (!title) { el.taskTitle.focus(); return }
  let est = parseInt(el.taskEst.value, 10)
  if (isNaN(est) || est < 1) est = 1
  if (est > 7) { est = 7; toast('超过 7 个番茄的任务，建议拆成小任务') }
  const t = { id: newTaskId(), title: title, est: est, pomos: 0, done: false }
  tasksDoc.items.push(t)
  saveTasks()
  if (!activeTask()) assignActiveTask(t.id)
  el.taskTitle.value = ''
  el.taskEst.value = 1
  renderTaskNow()
  renderTaskList()
  el.taskTitle.focus()
}
function taskSetDone(t, done) {
  let keepSession = false
  t.done = done
  if (done && activeTaskId === t.id) {
    keepSession = focusInProgress()
    activeTaskId = ''
    try { localStorage.removeItem('pomo.activeTask') } catch (e) {}
    if (!keepSession) sessionTaskId = ''
  }
  saveTasks()
  renderTaskNow()
  renderTaskList()
  if (done) {
    if (keepSession) toast('任务完成 🎉 本轮专注仍会计入它')
    else toast(t.pomos >= t.est ? '任务完成 🎉 达到预估番茄数' : '任务完成 🎉 剩余时间用来检查回顾')
  }
}
function taskDelete(t) {
  if (!confirm('删除任务「' + t.title + '」？')) return
  tasksDoc.items = tasksDoc.items.filter(x => x.id !== t.id)
  if (activeTaskId === t.id) {
    activeTaskId = ''
    try { localStorage.removeItem('pomo.activeTask') } catch (e) {}
  }
  if (sessionTaskId === t.id) sessionTaskId = ''
  saveTasks()
  renderTaskNow()
  renderTaskList()
}
function tasksOpen() {
  ensureToday()
  el.taskPanel.hidden = false
  renderTaskList()
  renderTaskNow()
}
function tasksClose() { el.taskPanel.hidden = true }
function renderInterrupts() {
  el.cntInner.textContent = sessionInner
  el.cntOuter.textContent = sessionOuter
  const on = focusInProgress()
  el.btnInner.classList.toggle('off', !on)
  el.btnOuter.classList.toggle('off', !on)
}
function logInterrupt(kind) {
  ensureToday()
  if (!focusInProgress()) {
    toast('专注进行中才能记录中断')
    return
  }
  const key = todayKey()
  const rec = history[key] || { count: 0, minutes: 0 }
  rec[kind] = (rec[kind] || 0) + 1
  history[key] = rec
  today = rec
  saveHistory()
  if (kind === 'inner') sessionInner++
  else sessionOuter++
  const btn = kind === 'inner' ? el.btnInner : el.btnOuter
  btn.classList.remove('pulse')
  void btn.offsetWidth
  btn.classList.add('pulse')
  renderInterrupts()
  el.quote.textContent = kind === 'inner'
    ? '已记录一次走神，把注意力拉回来，继续 🧠'
    : '已记录一次打扰，先记下来，休息时再处理 📞'
  if (!el.statsPanel.hidden) renderStats()
}

/* ---------- 舒尔特方格 ---------- */
const schulte = {
  open: false, pendingStart: false, size: 5,
  next: 1, mistakes: 0, t0: 0, done: false,
  best: load('pomo.schulte', { 4: 0, 5: 0, 6: 0 }),
}
let sTimerId = null
function sOpen(pending) {
  schulte.open = true
  schulte.pendingStart = !!pending
  el.schulte.hidden = false
  el.sAuto.checked = settings.schulte
  sNewGrid()
  sTimerId = setInterval(sTick, 100)
}
function sClose() {
  schulte.open = false
  schulte.pendingStart = false
  clearInterval(sTimerId); sTimerId = null
  el.schulte.hidden = true
}
function sNewGrid() {
  const n = schulte.size * schulte.size
  const arr = []
  for (let i = 1; i <= n; i++) arr.push(i)
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1))
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t
  }
  schulte.next = 1
  schulte.mistakes = 0
  schulte.t0 = 0
  schulte.done = false
  el.sGrid.style.gridTemplateColumns = 'repeat(' + schulte.size + ', 1fr)'
  el.sGrid.innerHTML = ''
  const fs = schulte.size === 4 ? '30px' : (schulte.size === 5 ? '24px' : '18px')
  arr.forEach(v => {
    const b = document.createElement('button')
    b.className = 's-cell'
    b.dataset.v = v
    b.textContent = v
    b.style.fontSize = fs
    el.sGrid.appendChild(b)
  })
  el.sTimer.textContent = '0.0 s'
  el.sMistakes.textContent = '错误 0'
  el.sResult.hidden = true
  el.sAgain.hidden = true
  el.sGo.hidden = true
  renderBest()
  Array.from(el.sSizes.children).forEach(x => x.classList.toggle('active', parseInt(x.dataset.size, 10) === schulte.size))
}
function sTick() {
  if (!schulte.t0 || schulte.done) return
  el.sTimer.textContent = ((performance.now() - schulte.t0) / 1000).toFixed(1) + ' s'
}
function renderBest() {
  const b = schulte.best[schulte.size]
  el.sBest.textContent = '最佳 ' + schulte.size + '×' + schulte.size + '：' + (b ? b.toFixed(1) + ' 秒' : '暂无记录')
}
function sFinish() {
  schulte.done = true
  const secs = (performance.now() - schulte.t0) / 1000
  const per = secs / (schulte.size * schulte.size)
  let rating = '需要练习', cls = 'bad'
  if (per <= 0.4) { rating = '优秀'; cls = 'great' }
  else if (per <= 0.6) { rating = '良好'; cls = 'good' }
  else if (per <= 0.8) { rating = '一般'; cls = 'ok' }
  const prev = schulte.best[schulte.size]
  const isBest = !prev || secs < prev
  if (isBest) { schulte.best[schulte.size] = secs; save('pomo.schulte', schulte.best) }
  el.sResult.hidden = false
  el.sResult.innerHTML = '用时 <b>' + secs.toFixed(1) + '</b> 秒 · 错误 ' + schulte.mistakes + ' 次' +
    '<br><span class="rating ' + cls + '">' + rating + '</span>' +
    (isBest ? ' · 新纪录！🎉' : '')
  renderBest()
  el.sAgain.hidden = false
  el.sAgain.textContent = '再测一次'
  el.sGo.hidden = false
  el.sGo.textContent = schulte.pendingStart ? '开始专注 🍅' : '关闭'
}
el.sGrid.addEventListener('click', e => {
  const cell = e.target.closest('.s-cell')
  if (!cell || schulte.done || cell.classList.contains('hit')) return
  const v = parseInt(cell.dataset.v, 10)
  if (v === schulte.next) {
    if (schulte.next === 1) schulte.t0 = performance.now()
    cell.classList.add('hit')
    schulte.next++
    if (schulte.next > schulte.size * schulte.size) sFinish()
  } else {
    schulte.mistakes++
    el.sMistakes.textContent = '错误 ' + schulte.mistakes
    cell.classList.add('wrong')
    setTimeout(() => cell.classList.remove('wrong'), 300)
  }
})
el.sSizes.addEventListener('click', e => {
  const b = e.target.closest('button')
  if (!b) return
  schulte.size = parseInt(b.dataset.size, 10)
  sNewGrid()
})
el.sRestart.addEventListener('click', sNewGrid)
el.sAgain.addEventListener('click', sNewGrid)
el.sGo.addEventListener('click', () => {
  const go = schulte.pendingStart
  sClose()
  if (go) start(true)
})
el.sClose.addEventListener('click', sClose)
el.sAuto.addEventListener('change', () => {
  settings.schulte = el.sAuto.checked
  save('pomo.settings', settings)
})
el.chipSchulte.addEventListener('click', () => sOpen(false))
el.sAuto.checked = settings.schulte

/* ---------- 专注统计 ---------- */
function toast(msg) {
  let t = document.getElementById('toast')
  if (!t) {
    t = document.createElement('div')
    t.id = 'toast'
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;transition:opacity .3s;opacity:0;pointer-events:none;max-width:80vw;text-align:center;'
    document.body.appendChild(t)
  }
  t.textContent = msg
  t.style.opacity = '1'
  clearTimeout(toast._t)
  toast._t = setTimeout(() => { t.style.opacity = '0' }, 2200)
}
function dayRec(d) { return history[d] || { count: 0, minutes: 0 } }
function lastNDays(n) {
  const out = []
  const now = new Date()
  const wd = ['日', '一', '二', '三', '四', '五', '六']
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i)
    const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate()
    out.push({ key, label: (d.getMonth() + 1) + '/' + d.getDate(), wd: wd[d.getDay()], ...dayRec(key) })
  }
  return out
}
function streakDays() {
  let s = 0
  const now = new Date()
  for (let i = 0; i < 365; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i)
    const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate()
    if (dayRec(key).count > 0) s++
    else if (i > 0) break
  }
  return s
}
function renderStats() {
  const days = lastNDays(7)
  const week = days.reduce((a, d) => a + d.minutes, 0)
  const weekCount = days.reduce((a, d) => a + d.count, 0)
  const weekInner = days.reduce((a, d) => a + (d.inner || 0), 0)
  const weekOuter = days.reduce((a, d) => a + (d.outer || 0), 0)
  let totalMin = 0, totalCount = 0, daysActive = 0
  for (const k in history) { totalMin += history[k].minutes || 0; totalCount += history[k].count || 0; daysActive++ }
  el.statsSummary.innerHTML = '今日：<b>' + today.minutes + '</b> 分钟 · ' + today.count + ' 个番茄<br>' +
    '今日中断：🧠 ' + (today.inner || 0) + ' 次 · 📞 ' + (today.outer || 0) + ' 次<br>' +
    '近 7 天：' + week + ' 分钟 · ' + weekCount + ' 个番茄<br>' +
    '近 7 天中断：🧠 ' + weekInner + ' 次 · 📞 ' + weekOuter + ' 次'
  el.statsTotal.textContent = '累计：' + totalMin + ' 分钟（约 ' + (totalMin / 60).toFixed(1) + ' 小时）· ' + totalCount + ' 个番茄 · ' + daysActive + ' 天有记录 · 连续 ' + streakDays() + ' 天'
  const max = Math.max(1, ...days.map(d => d.minutes))
  el.statsBars.innerHTML = ''
  days.forEach(d => {
    const col = document.createElement('div')
    col.className = 'stats-bar-col'
    const bar = document.createElement('div')
    bar.className = 'stats-bar' + (d.minutes === 0 ? ' zero' : '')
    bar.style.height = (d.minutes === 0 ? 3 : Math.max(4, Math.round(d.minutes / max * 96))) + 'px'
    bar.title = d.key + ' 周' + d.wd + '：' + d.minutes + ' 分钟'
    const val = document.createElement('div')
    val.className = 'stats-bar-val'
    val.textContent = d.minutes
    const lab = document.createElement('div')
    lab.className = 'stats-bar-label'
    lab.textContent = d.label
    col.appendChild(val); col.appendChild(bar); col.appendChild(lab)
    el.statsBars.appendChild(col)
  })
}
function statsOpen() {
  ensureToday()
  el.statsPanel.hidden = false
  el.statsIO.value = ''
  renderStats()
}
function statsClose() { el.statsPanel.hidden = true }
function statsExport() {
  const data = {
    app: 'pomodoro-tray', exportedAt: new Date().toISOString(),
    history, settings: Object.assign({}, settings, { noise: false }), schulteBest: schulte.best,
    tasks: tasksDoc, activeTask: activeTaskId,
  }
  el.statsIO.value = JSON.stringify(data)
  el.statsIO.select()
  let copied = false
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el.statsIO.value); copied = true
    } else if (document.execCommand) {
      copied = document.execCommand('copy')
    }
  } catch (e) {}
  toast(copied ? '已复制到剪贴板，也可手动复制下方内容' : '复制失败，请手动选择并复制')
}
function statsImport() {
  let data
  try { data = JSON.parse(el.statsIO.value) } catch (e) { toast('内容不是有效的备份数据'); return }
  if (!data || typeof data.history !== 'object') { toast('备份数据缺少 history 字段'); return }
  history = data.history
  saveHistory()
  if (data.settings && typeof data.settings === 'object') {
    settings = Object.assign(settings, data.settings)
    settings.noise = false
    save('pomo.settings', settings)
  }
  if (data.schulteBest && typeof data.schulteBest === 'object') { schulte.best = data.schulteBest; save('pomo.schulte', schulte.best) }
  if (data.tasks && Array.isArray(data.tasks.items)) {
    tasksDoc = normalizeTasks(data.tasks)
    saveTasks()
    activeTaskId = (typeof data.activeTask === 'string' && tasksDoc.items.some(t => t.id === data.activeTask && !t.done)) ? data.activeTask : ''
    try {
      if (activeTaskId) localStorage.setItem('pomo.activeTask', activeTaskId)
      else localStorage.removeItem('pomo.activeTask')
    } catch (e) {}
    if (mode === 'focus') sessionTaskId = activeTaskId
  }
  today = history[todayKey()] || { count: 0, minutes: 0 }
  el.dFocus.value = settings.focus; el.dShort.value = settings.short; el.dLong.value = settings.long
  if (!running && remaining >= sessionTotal) { sessionTotal = total(); remaining = sessionTotal }
  render()
  renderTaskNow()
  renderTaskList()
  renderStats()
  toast('导入成功')
}
el.chipStats.addEventListener('click', statsOpen)
el.statsClose.addEventListener('click', statsClose)
el.statsExport.addEventListener('click', statsExport)
el.statsImport.addEventListener('click', statsImport)

/* ---------- 今日待办事件 ---------- */
el.chipTasks.addEventListener('click', tasksOpen)
el.taskClose.addEventListener('click', tasksClose)
el.taskAdd.addEventListener('click', addTask)
el.taskTitle.addEventListener('keydown', e => { if (e.key === 'Enter') addTask() })
el.taskEst.addEventListener('keydown', e => { if (e.key === 'Enter') addTask() })
el.taskList.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  const row = btn.closest('.task-item')
  if (!row) return
  const t = tasksDoc.items.find(x => x.id === row.dataset.id)
  if (!t) return
  if (btn.dataset.act === 'pick') {
    if (!t.done) setActiveTask(t.id)
  } else if (btn.dataset.act === 'done') {
    taskSetDone(t, !t.done)
  } else if (btn.dataset.act === 'del') {
    taskDelete(t)
  }
})
el.taskNow.addEventListener('click', () => {
  if (schulte.open) { toast('先关闭舒尔特测试'); return }
  if (!el.statsPanel.hidden) statsClose()
  tasksOpen()
})
el.btnInner.addEventListener('click', () => logInterrupt('inner'))
el.btnOuter.addEventListener('click', () => logInterrupt('outer'))

/* ---------- 事件 ---------- */
el.main.addEventListener('click', toggle)
el.reset.addEventListener('click', reset)
el.skip.addEventListener('click', skip)
el.tabs.addEventListener('click', e => {
  const b = e.target.closest('button')
  if (!b) return
  if (running) pause()
  switchTo(b.dataset.mode)
})
function chip(btn, active, onClick) {
  btn.classList.toggle('active', active)
  btn.addEventListener('click', () => {
    const next = !btn.classList.contains('active')
    btn.classList.toggle('active', next)
    onClick(next)
  })
}
chip(el.chipAuto, settings.auto, v => { settings.auto = v; save('pomo.settings', settings) })
chip(el.chipSound, settings.sound, v => { settings.sound = v; save('pomo.settings', settings); if (v) playBell() })
chip(el.chipNoise, settings.noise, v => {
  settings.noise = v; save('pomo.settings', settings)
  if (v) noiseOn(); else noiseOff()
})
chip(el.chipFull, false, v => {
  if (v) {
    const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()
    if (p && p.catch) p.catch(() => el.chipFull.classList.remove('active'))
  } else if (document.fullscreenElement) document.exitFullscreen()
})
document.addEventListener('fullscreenchange', () => {
  el.chipFull.classList.toggle('active', !!document.fullscreenElement)
})
function bindDur(input, key) {
  input.value = settings[key]
  input.addEventListener('change', () => {
    let v = parseInt(input.value, 10)
    if (isNaN(v) || v < 1) v = 1
    const max = key === 'focus' ? 180 : 60
    if (v > max) v = max
    input.value = v
    settings[key] = v
    save('pomo.settings', settings)
    if (mode !== key) return
    // 本轮还没开始计时：直接按新时长刷新
    if (!running && remaining >= sessionTotal) {
      sessionTotal = total()
      remaining = sessionTotal
      render()
      return
    }
    // 已经开始（运行中或暂停中）：本轮保持原时长，设置从下一轮生效，
    // 否则会出现倒计时、进度环、统计各自按不同时长计算的错乱
    toast('时长已保存，将从下一轮「' + MODES[key].name + '」开始生效')
  })
}
bindDur(el.dFocus, 'focus')
bindDur(el.dShort, 'short')
bindDur(el.dLong, 'long')
try { el.goal.value = localStorage.getItem('pomo.goal') || '' } catch (e) {}
el.goal.addEventListener('input', () => {
  try { localStorage.setItem('pomo.goal', el.goal.value) } catch (e) {}
})
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || ''
  if (tag === 'INPUT' || tag === 'TEXTAREA') return
  // 按钮聚焦时，空格/回车交给按钮原生激活（这样下方功能可以用键盘操作）
  if (tag === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return
  if (e.code === 'Escape') {
    if (schulte.open) { sClose(); return }
    if (!el.taskPanel.hidden) { tasksClose(); return }
    if (!el.statsPanel.hidden) { statsClose(); return }
  }
  if (schulte.open || !el.statsPanel.hidden || !el.taskPanel.hidden) return
  if (e.code === 'Space') { e.preventDefault(); toggle() }
  else if (e.code === 'KeyR') reset()
  else if (e.code === 'KeyS') skip()
  else if (e.code === 'KeyF') {
    if (document.fullscreenElement) document.exitFullscreen()
    else document.documentElement.requestFullscreen()
  }
})
document.addEventListener('visibilitychange', () => { if (!document.hidden && running) tick() })

render()
renderTaskNow()
renderTaskList()
</script>
